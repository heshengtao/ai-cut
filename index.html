<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Cut</title>
  </head>

  <body>
    <div id="app"></div>
    <script>
      // 在样式加载前先把底色铺上：否则窗口打开时会先闪一帧白。
      // 这段判断必须与 `composables/useTheme` 保持一致（同一个 localStorage 键、同一个默认值）。
      (function () {
        try {
          var mode = localStorage.getItem("ai-cut-theme") || "dark";
          var dark =
            mode === "dark" ||
            (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.style.backgroundColor = dark ? "#1c1b1f" : "#fef7ff";
        } catch (e) {
          /* 隐私模式读不到 localStorage：留着浏览器默认底色就好 */
        }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
