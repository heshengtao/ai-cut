[package]
name = "ai-cut"
version = "1.0.0"
description = "AI Cut — AI 视频剪辑器（原型）"
authors = ["you"]
edition = "2021"
license = "Apache-2.0"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_cut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
base64 = "0.22"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-shell = "2.5.0"
# 自动更新：从 GitHub Releases 的 latest.json 取新版本，验签后安装；
# 装完用 process 插件重启到新版本。端点与公钥在 tauri.conf.json 的 plugins.updater。
# `system-proxy`：更新检查 / 下载也跟随系统代理。
tauri-plugin-updater = { version = "2", features = ["system-proxy"] }
tauri-plugin-process = "2"
# 用系统默认浏览器打开外链（顶栏 GitHub 按钮）。
open = "5"
axum = "0.8"
tokio = { version = "1", features = ["net", "sync", "time", "rt", "macros"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
# `system-proxy`：让 reqwest 自己也能读 Windows / macOS 的系统代理（Windows 注册表、
# macOS SystemConfiguration、环境变量），作为我们解析结果之外的兜底。
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls", "socks", "system-proxy", "multipart"] }
futures-util = { version = "0.3", default-features = false }
sha2 = "0.10"
sherpa-onnx = "1.13.8"
tar = "0.4"
flate2 = "1"
# Linux 的 CUDA 组件（NVIDIA redist）只发 `.tar.xz`：`tar` 认不了 xz，这里补一个流式解码器。
# 和 ai-daw 一样**所有平台都编进来**（Windows 上 liblzma 随 build 自带源码），
# 这样 Linux 那份运行时清单在 Windows 上也能被类型检查和测试覆盖。
xz2 = "0.1"
zip = "2"
plist = "1"
walkdir = "2"
png = "0.17"
ofx-host = { path = "../crates/ofx-host" }
# ONNX Runtime 由 ort 自带：macOS 含 CoreML、Windows 含 DirectML、Linux 用 CPU。
# sherpa-onnx 预编译包自带的 ONNX Runtime 不再参与链接（见 crates/sherpa-onnx-sys）。
# sherpa-onnx 静态库里的 UVR / Spleeter 音源分离 C API（Rust 绑定尚未暴露）。
sherpa-separation = { path = "../crates/sherpa-separation" }
# 音源分离的 STFT / iSTFT。
rustfft = "6"
# 响度（EBU R128 / ITU-R BS.1770）。
ebur128 = "0.1"

# 执行后端按平台启用：
# - macOS：静态链接 + CoreML（没有 CUDA，不需要运行时切换，安装包不变）；
# - Windows / Linux：运行时加载（load-dynamic），CPU / DirectML 随包，CUDA 按需下载。
#   `api-24` 是低水位：ORT 1.24+ 的 dll/so 都能加载，方便换运行时版本。
[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.13", features = ["coreml"] }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "tracing",
    "load-dynamic",
    "api-24",
    "cuda",
    "directml",
] }
# 读 `Internet Settings` 里的系统代理（ProxyEnable / ProxyServer / ProxyOverride）。
windows-registry = "0.6"

[target.'cfg(all(not(target_os = "macos"), not(target_os = "windows")))'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "tracing",
    "load-dynamic",
    "api-24",
    "cuda",
] }

# sherpa-onnx 的预编译包自带一份 CPU-only ONNX Runtime；macOS 上我们删掉它、复用
# ort 的静态运行时，Windows / Linux 上保留它（ort 改为运行时加载，互不冲突）。
[patch.crates-io]
sherpa-onnx-sys = { path = "../crates/sherpa-onnx-sys" }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# 调试运行时也要能跑 OFX 逐帧渲染：默认 -O0 下像素转换比 release 慢两个数量级，
# 预览烘焙会从几分钟变成几秒级。依赖（含 cc 编译的 ofx-host）进一步放到 -O2。
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# `lzma-rs` 0.3.0（zip 2.x 的 LZMA 解码器）在依赖统一 -O2、本 crate -O1 时，
# 泛型 `decode_bit` 会引用一个被 LLVM 内部化掉的符号，Windows 链接报 LNK2019
# （`anon.*.llvm.*`）。把它对齐到本 crate 的优化级别即可稳定链接。
[profile.dev.package.lzma-rs]
opt-level = 1

# Opt out of any repository-root Cargo workspace: this crate is its own root.
[workspace]
