[package]
name = "ai-cut"
version = "0.1.0"
description = "AI Cut — AI 视频剪辑器（原型）"
authors = ["you"]
edition = "2021"
license = "Apache-2.0"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_cut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-shell = "2.5.0"
# 自动更新：从 GitHub Releases 的 latest.json 取新版本，验签后安装；
# 装完用 process 插件重启到新版本。端点与公钥在 tauri.conf.json 的 plugins.updater。
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
axum = "0.8"
tokio = { version = "1", features = ["net", "sync", "time", "rt", "macros"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls"] }
futures-util = { version = "0.3", default-features = false }
sha2 = "0.10"
sherpa-onnx = "1.13.8"
tar = "0.4"
flate2 = "1"
# 复用 sherpa-onnx 已经静态链接的 ONNX Runtime（1.28.2），避免二进制里出现两份 ORT。
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "api-17", "alternative-backend"] }
ort-backend = { path = "../crates/ort-backend" }
# sherpa-onnx 静态库里的 UVR / Spleeter 音源分离 C API（Rust 绑定尚未暴露）。
sherpa-separation = { path = "../crates/sherpa-separation" }
# 音源分离的 STFT / iSTFT。
rustfft = "6"
# 响度（EBU R128 / ITU-R BS.1770）。
ebur128 = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Opt out of any repository-root Cargo workspace: this crate is its own root.
[workspace]
