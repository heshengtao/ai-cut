name: Release

on:
  push:
    tags:
      - "v*"

env:
  APP_NAME: AI Cut
  PNPM_VERSION: "11"
  NODE_VERSION: "22"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-amd64
            bundles: --bundles deb,appimage
          - platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: linux-arm64
            bundles: --bundles deb,appimage
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-amd64
            bundles: --bundles msi,nsis
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm64
            # `app` 才会产出更新包（.app.tar.gz）；dmg 只是分发外壳。
            bundles: --bundles dmg,app

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target
            crates/aicut -> target
            crates/ort-backend -> target
            crates/sherpa-separation -> target

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libclang-dev \
            libasound2-dev \
            libxcb1-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libssl-dev \
            libgtk-3-dev \
            xdg-utils

      - name: Build
        run: pnpm tauri build --target ${{ matrix.target }} ${{ matrix.bundles }}
        env:
          # 更新包签名：私钥 + 口令来自仓库 Secrets；缺失会让 build 直接失败（有意为之）。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect Linux bundles
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: |
          mkdir -p out
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          tag="${{ github.ref_name }}"
          for f in "$bundle"/deb/*.deb; do
            [ -f "$f" ] || continue
            cp "$f" "out/AI-Cut-$tag-${{ matrix.artifact }}.deb"
          done
          for f in "$bundle"/appimage/*.AppImage "$bundle"/appimage/*.AppImage.sig; do
            [ -f "$f" ] || continue
            cp "$f" "out/AI-Cut-$tag-${{ matrix.artifact }}.AppImage${f##*.AppImage}"
          done
          ls -la out

      - name: Collect Windows bundles
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $bundle = "src-tauri/target/${{ matrix.target }}/release/bundle"
          $tag = "${{ github.ref_name }}"
          Get-ChildItem "$bundle/msi/*.msi" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName "out/AI-Cut-$tag-${{ matrix.artifact }}.msi" }
          Get-ChildItem "$bundle/nsis/*-setup.exe" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName "out/AI-Cut-$tag-${{ matrix.artifact }}-setup.exe" }
          Get-ChildItem "$bundle/nsis/*-setup.exe.sig" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName "out/AI-Cut-$tag-${{ matrix.artifact }}-setup.exe.sig" }
          Get-ChildItem out

      - name: Collect macOS bundles
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          mkdir -p out
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          tag="${{ github.ref_name }}"
          for f in "$bundle"/dmg/*.dmg; do
            [ -f "$f" ] || continue
            cp "$f" "out/AI-Cut-$tag-${{ matrix.artifact }}.dmg"
          done
          for f in "$bundle"/macos/*.app.tar.gz "$bundle"/macos/*.app.tar.gz.sig; do
            [ -f "$f" ] || continue
            cp "$f" "out/AI-Cut-$tag-${{ matrix.artifact }}.app.tar.gz${f##*.app.tar.gz}"
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ai-cut-${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List collected artifacts
        run: ls -la artifacts

      - name: Generate latest.json for the updater
        run: |
          node -e "
          const fs = require('fs');
          const tag = process.env.TAG;
          const base = 'https://github.com/' + process.env.REPO + '/releases/download/' + tag + '/';
          const files = fs.readdirSync('artifacts');
          const find = (suffix, mid) => files.find((f) => f.endsWith(suffix) && (!mid || f.includes(mid)));
          const platforms = {};
          const add = (key, fileSuffix, sigSuffix, mid) => {
            const f = find(fileSuffix, mid);
            const s = find(sigSuffix, mid);
            if (f && s) {
              platforms[key] = {
                signature: fs.readFileSync('artifacts/' + s, 'utf8').trim(),
                url: base + f,
              };
            }
          };
          add('windows-x86_64', '-setup.exe', '-setup.exe.sig');
          add('darwin-aarch64', '.app.tar.gz', '.app.tar.gz.sig', 'macos-arm64');
          add('linux-x86_64', 'linux-amd64.AppImage', 'linux-amd64.AppImage.sig');
          add('linux-aarch64', 'linux-arm64.AppImage', 'linux-arm64.AppImage.sig');
          fs.writeFileSync('artifacts/latest.json', JSON.stringify({
            version: tag.replace(/^v/, ''),
            notes: 'See the release notes on GitHub.',
            pub_date: new Date().toISOString(),
            platforms,
          }, null, 2));
          "
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ env.APP_NAME }} ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          body: |
            ## 📦 Downloads

            👉 [Windows — installer (.msi)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/AI-Cut-${{ github.ref_name }}-windows-amd64.msi)

            👉 [Windows — setup (.exe)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/AI-Cut-${{ github.ref_name }}-windows-amd64-setup.exe)

            👉 [macOS — Apple Silicon (.dmg)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/AI-Cut-${{ github.ref_name }}-macos-arm64.dmg)

            👉 [Linux — x86_64 (.AppImage)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/AI-Cut-${{ github.ref_name }}-linux-amd64.AppImage)

            👉 [Linux — x86_64 (.deb)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/AI-Cut-${{ github.ref_name }}-linux-amd64.deb)

            👉 [Linux — arm64 (.AppImage)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/AI-Cut-${{ github.ref_name }}-linux-arm64.AppImage)

            👉 [Linux — arm64 (.deb)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/AI-Cut-${{ github.ref_name }}-linux-arm64.deb)

            ## ⚠️ macOS: "App is damaged" / 「App 已损坏，无法打开」

            **EN:** The app is ad-hoc signed (not notarized), so macOS quarantines downloads. Run this in Terminal, then open the app normally:

            **中文：** 应用为自签名（未公证），从网络下载会带隔离属性。在终端执行以下命令后即可正常打开：

            ```bash
            xattr -cr "/Applications/AI Cut.app"
            ```

            ## 🔄 Auto-update

            Installed apps check this release's `latest.json` and update in place (Settings → About → Check for updates).
          files: artifacts/*
